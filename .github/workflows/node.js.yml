name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'D4F_front/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'D4F_front/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]   # Aligné avec engines: "^20.19 || >=22.12.0"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      working-directory: ./D4F_front
      run: npm install

    - name: Build frontend
      working-directory: ./D4F_front
      run: npm run build

    # Optionnel : exécuter vite preview (rare en CI)
    # - name: Preview
    #   working-directory: ./D4F_front
    #   run: npm run preview
